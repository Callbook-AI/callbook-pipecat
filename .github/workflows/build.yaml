name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - "**"
    paths-ignore:
      - "docs/**"

concurrency:
  group: build-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Build and Install"
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        id: setup_python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: Setup virtual environment
        run: |
          python -m venv .venv
      - name: Install basic Python dependencies
        run: |
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -r dev-requirements.txt
      - name: Build project
        run: |
          source .venv/bin/activate
          python -m build
      - name: Install and verify the built wheel
        run: |
          source .venv/bin/activate
          pip install dist/*.whl
          python -I - <<'PYCODE'
          import asyncio
          import importlib.util
          from pipecat.frames.frames import OutputAudioRawFrame
          from pipecat.serializers.protobuf import ProtobufFrameSerializer

          assert importlib.util.find_spec("pipecat.serializers.livekit") is None

          async def check_audio():
              serializer = ProtobufFrameSerializer()
              frame = OutputAudioRawFrame(audio=b"\x01\x00", sample_rate=16000, num_channels=1)
              restored = await serializer.deserialize(await serializer.serialize(frame))
              assert (restored.audio, restored.sample_rate, restored.num_channels) == (frame.audio, 16000, 1)

          asyncio.run(check_audio())
          PYCODE
