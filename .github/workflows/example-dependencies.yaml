name: Example dependency contracts

on:
  workflow_dispatch:
  pull_request:
    paths:
      - "examples/deployment/modal-example/**"
      - "examples/local-input-select-stt/**"
      - "examples/studypal/**"
      - ".github/workflows/example-dependencies.yaml"
  push:
    branches: [main]
    paths:
      - "examples/deployment/modal-example/**"
      - "examples/local-input-select-stt/**"
      - "examples/studypal/**"
      - ".github/workflows/example-dependencies.yaml"

permissions:
  contents: read

jobs:
  examples:
    name: "${{ matrix.example }}"
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        example:
          - examples/deployment/modal-example
          - examples/local-input-select-stt
          - examples/studypal
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ${{ matrix.example }}/requirements.txt
      - name: Install local audio build dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y portaudio19-dev
      - name: Install this example's dependencies
        working-directory: ${{ matrix.example }}
        run: |
          python -m pip install -r requirements.txt
          python -m pip check
      - name: Run offline compatibility contracts
        working-directory: ${{ matrix.example }}
        run: python -m unittest discover -s . -p test_dependency_compatibility.py -v
